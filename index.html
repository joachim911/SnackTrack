<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SnackTrack</title>
<meta name="theme-color" content="#1B1A17">
<meta name="description" content="Din daglige næringslogg, ført som en kvittering.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SnackTrack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --backdrop: #1B1A17;
    --paper: #F7F3E9;
    --paper-shadow: #ECE4D2;
    --ink: #2A2724;
    --ink-soft: #837A6C;
    --line: #D8D0BE;
    --stamp: #A63D2F;
    --forest: #3F5D4C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--backdrop);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02), transparent 40%);
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
    font-family: 'Space Mono', monospace;
    color: var(--ink);
  }

  .receipt-wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
  }

  .receipt {
    background: var(--paper);
    box-shadow:
      0 1px 0 var(--paper-shadow) inset,
      0 20px 40px -10px rgba(0,0,0,0.6);
    padding: 28px 24px 22px;
    position: relative;
  }

  .receipt::after {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 0;
    right: 0;
    height: 22px;
    background-image: radial-gradient(circle at 11px 0, transparent 10px, var(--backdrop) 10.5px);
    background-size: 22px 22px;
    background-repeat: repeat-x;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .nav-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--forest); color: var(--forest); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .store-name {
    font-family: 'Anton', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    text-align: center;
    margin: 6px 0 2px;
  }

  .store-sub {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .date-line {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 10px 0 14px;
    text-transform: capitalize;
  }

  .dashed {
    border: none;
    border-top: 1.5px dashed var(--line);
    margin: 14px 0;
  }

  .entries {
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 20px;
  }

  .entry {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
  }

  .entry:hover .entry-name { text-decoration: line-through; text-decoration-color: var(--stamp); }

  .entry-name {
    text-transform: uppercase;
    letter-spacing: 0.3px;
    flex: 1;
  }
  .entry-name .time {
    display: block;
    font-size: 9px;
    color: var(--ink-soft);
    text-transform: none;
    letter-spacing: 0;
  }

  .entry-kcal {
    white-space: nowrap;
    font-weight: 700;
  }

  .empty-msg {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 10px 0;
    font-style: italic;
  }

  .totals-block {
    margin-top: 4px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    color: var(--ink-soft);
  }
  .total-row span:last-child { color: var(--ink); font-weight: 700; }

  .stamp-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 16px 0 6px;
  }

  .stamp {
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    border-radius: 50%;
    width: 118px;
    height: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: rotate(-6deg);
    opacity: 0.92;
  }

  .stamp .kcal-num {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    line-height: 1;
  }
  .stamp .kcal-label {
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 3px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 6px 2px;
    color: var(--ink);
    outline: none;
  }
  .input-row input::placeholder { color: var(--ink-soft); }

  .add-btn {
    background: var(--forest);
    color: var(--paper);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform .15s, opacity .15s;
  }
  .add-btn:hover:not(:disabled) { transform: scale(1.06); }
  .add-btn:disabled { opacity: 0.5; cursor: default; }

  .status-line {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    min-height: 14px;
  }
  .status-line.error { color: var(--stamp); }

  .barcode {
    margin-top: 22px;
    height: 30px;
    background: repeating-linear-gradient(
      90deg,
      var(--ink) 0px, var(--ink) 2px,
      transparent 2px, transparent 5px,
      var(--ink) 5px, var(--ink) 6px,
      transparent 6px, transparent 10px
    );
    opacity: 0.85;
  }

  .thanks {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    margin-top: 8px;
    text-transform: uppercase;
  }

  @media (max-width: 380px) {
    .receipt { padding: 22px 16px 18px; }
  }
</style>
</head>
<body>

<div class="receipt-wrap">
  <div class="receipt">
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="Forrige dag">‹</button>
      <span class="store-sub" id="dayCounter"></span>
      <button class="nav-btn" id="nextBtn" aria-label="Neste dag">›</button>
    </div>
    <div style="text-align:right; margin-top:-4px;">
      <button id="settingsBtn" style="background:none;border:none;color:var(--ink-soft);font-size:10px;letter-spacing:1px;cursor:pointer;font-family:'Space Mono',monospace;text-decoration:underline;padding:0;">Gemini API-nøkkel</button>
    </div>

    <div class="store-name">SNACKTRACK</div>
    <div class="date-line" id="dateLine"></div>

    <hr class="dashed">

    <div class="entries" id="entries"></div>

    <hr class="dashed">

    <div class="stamp-wrap">
      <div class="stamp">
        <div class="kcal-num" id="kcalTotal">0</div>
        <div class="kcal-label">KCAL</div>
      </div>
    </div>

    <div class="totals-block">
      <div class="total-row"><span>Protein</span><span id="proteinTotal">0 g</span></div>
      <div class="total-row"><span>Fett</span><span id="fatTotal">0 g</span></div>
      <div class="total-row"><span>Karbohydrater</span><span id="carbTotal">0 g</span></div>
    </div>

    <hr class="dashed">

    <div class="input-row">
      <input type="text" id="foodInput" placeholder="hva spiste du?" autocomplete="off">
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="status-line" id="statusLine"></div>

    <div class="barcode"></div>
    <div class="thanks">takk for i dag</div>
  </div>
</div>

<script>
  let currentDate = new Date();
  let entries = [];
  let loading = false;

  function dateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `log:${y}-${m}-${day}`;
  }

  function isToday(d) {
    const t = new Date();
    return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
  }

  function formatDate(d) {
    return new Intl.DateTimeFormat('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
  }

  function formatTime() {
    const t = new Date();
    return String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  }

  function loadDay() {
    document.getElementById('dateLine').textContent = formatDate(currentDate);
    document.getElementById('dayCounter').textContent = isToday(currentDate) ? 'i dag' : '';
    document.getElementById('nextBtn').disabled = isToday(currentDate);

    try {
      const raw = localStorage.getItem(dateKey(currentDate));
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) {
      entries = [];
    }
    render();
  }

  function saveDay() {
    try {
      localStorage.setItem(dateKey(currentDate), JSON.stringify(entries));
    } catch (e) {
      setStatus('Klarte ikke å lagre. Prøv igjen.', true);
    }
  }

  function render() {
    const list = document.getElementById('entries');
    if (entries.length === 0) {
      list.innerHTML = '<div class="empty-msg">ingen varer registrert ennå</div>';
    } else {
      list.innerHTML = entries.map(e => `
        <div class="entry" data-id="${e.id}" title="Klikk for å fjerne">
          <span class="entry-name">${escapeHtml(e.name)}<span class="time">${e.time || ''}</span></span>
          <span class="entry-kcal">${e.kcal}</span>
        </div>
      `).join('');
      list.querySelectorAll('.entry').forEach(el => {
        el.addEventListener('click', () => removeEntry(el.dataset.id));
      });
    }

    const totals = entries.reduce((acc, e) => {
      acc.kcal += Number(e.kcal) || 0;
      acc.protein += Number(e.protein_g) || 0;
      acc.fat += Number(e.fat_g) || 0;
      acc.carb += Number(e.carb_g) || 0;
      return acc;
    }, { kcal: 0, protein: 0, fat: 0, carb: 0 });

    document.getElementById('kcalTotal').textContent = Math.round(totals.kcal);
    document.getElementById('proteinTotal').textContent = Math.round(totals.protein) + ' g';
    document.getElementById('fatTotal').textContent = Math.round(totals.fat) + ' g';
    document.getElementById('carbTotal').textContent = Math.round(totals.carb) + ' g';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function setStatus(msg, isError) {
    const el = document.getElementById('statusLine');
    el.textContent = msg;
    el.className = 'status-line' + (isError ? ' error' : '');
  }

  async function removeEntry(id) {
    entries = entries.filter(e => e.id !== id);
    render();
    await saveDay();
  }

  function getApiKey() {
    return localStorage.getItem('snacktrack_gemini_key') || '';
  }

  function promptForApiKey() {
    const current = getApiKey();
    const key = prompt('Lim inn din gratis Gemini API-nøkkel (fra aistudio.google.com → Get API key). Den lagres kun lokalt på denne enheten.', current);
    if (key !== null) {
      localStorage.setItem('snacktrack_gemini_key', key.trim());
    }
  }

  document.getElementById('settingsBtn').addEventListener('click', promptForApiKey);

  async function estimateNutrition(text) {
    const apiKey = getApiKey();
    if (!apiKey) {
      promptForApiKey();
      if (!getApiKey()) throw new Error('Ingen API-nøkkel');
    }

    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + encodeURIComponent(apiKey);
    let response;
    try {
      response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: "Du er en ernæringsassistent. Brukeren beskriver hva de har spist, på norsk, i fritekst, ofte med mengde (f.eks. '400g yoghurt naturell', '2 kyllingfileter', '1 brødskive'). Del beskrivelsen i separate matvarer der det er naturlig. Bruk oppgitt mengde når den finnes; anslå en vanlig porsjonsstørrelse når mengde mangler. Svar med realistiske norske næringsverdier." }]
          },
          contents: [{ role: "user", parts: [{ text: text }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  name: { type: "STRING", description: "Kort norsk beskrivelse, maks 4 ord, med stor forbokstav" },
                  kcal: { type: "INTEGER" },
                  protein_g: { type: "INTEGER" },
                  fat_g: { type: "INTEGER" },
                  carb_g: { type: "INTEGER" }
                },
                required: ["name", "kcal", "protein_g", "fat_g", "carb_g"]
              }
            }
          }
        })
      });
    } catch (networkErr) {
      throw new Error('Nettverksfeil - sjekk internettforbindelsen (' + networkErr.message + ')');
    }

    if (!response.ok) {
      let detail = '';
      try { detail = (await response.json()).error?.message || ''; } catch (e) {}
      if (response.status === 400 || response.status === 401 || response.status === 403) {
        localStorage.removeItem('snacktrack_gemini_key');
        throw new Error('Ugyldig API-nøkkel (' + response.status + (detail ? ': ' + detail : '') + ')');
      }
      throw new Error('API-feil ' + response.status + (detail ? ': ' + detail : ''));
    }
    const data = await response.json();
    const candidate = data.candidates && data.candidates[0];
    const raw = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;
    if (!raw) {
      throw new Error('Tomt svar fra Gemini (finishReason: ' + (candidate && candidate.finishReason) + ')');
    }
    const items = JSON.parse(raw.trim());
    if (!Array.isArray(items)) return [items];
    return items;
  }

  async function addFood() {
    const input = document.getElementById('foodInput');
    const text = input.value.trim();
    if (!text || loading) return;

    loading = true;
    document.getElementById('addBtn').disabled = true;
    setStatus('anslår næringsinnhold …');

    try {
      const items = await estimateNutrition(text);
      const time = formatTime();
      items.forEach(it => {
        entries.push({
          id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          name: it.name || text,
          kcal: it.kcal || 0,
          protein_g: it.protein_g || 0,
          fat_g: it.fat_g || 0,
          carb_g: it.carb_g || 0,
          time
        });
      });
      render();
      await saveDay();
      input.value = '';
      setStatus('');
    } catch (e) {
      console.error('SnackTrack feil:', e);
      setStatus(e.message || 'Klarte ikke å tolke det. Prøv å beskrive det litt annerledes.', true);
    } finally {
      loading = false;
      document.getElementById('addBtn').disabled = false;
    }
  }

  document.getElementById('addBtn').addEventListener('click', addFood);
  document.getElementById('foodInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addFood();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentDate = new Date(currentDate.getTime() - 86400000);
    loadDay();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (isToday(currentDate)) return;
    currentDate = new Date(currentDate.getTime() + 86400000);
    loadDay();
  });

  loadDay();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
